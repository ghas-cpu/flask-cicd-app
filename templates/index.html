<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تطبيق Flask CI/CD</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>
<body>
    <div class="container">
        <h1>حاسبة Flask السحابية 🚀</h1>
        <form method="POST">
            <input type="number" step="any" name="n1" placeholder="الرقم الأول" required>
            <input type="number" step="any" name="n2" placeholder="الرقم الثاني" required>
            <button type="submit">احسب المجموع</button>
        </form>
        {% if result is not none %}
            <div class="result">النتيجة: {{ result }}</div>
        {% endif %}
    </div>
</body>
</html>
